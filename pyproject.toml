[project]
name = "claude-yolo"
version = "0.3.0"
description = "Run Claude Code in an ephemeral Docker container (yolo mode)."
requires-python = ">=3.10"
dependencies = []

# `yolo.py` works two ways from the same file:
#   1. standalone — its PEP 723 header + shebang let `./yolo.py` self-run under uv;
#   2. installed — the console script below puts a `yolo` executable on PATH via
#      `uv tool install` / `pipx install` (no runtime deps are pulled in).
[project.scripts]
yolo = "yolo:main"

# The runtime is the single top-level module `yolo.py`; ship just that in the wheel.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["yolo.py"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# Long lines are intentional here: the inline Dockerfile RUN commands, argparse
# help strings, and the docker-run echo are clearer unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
