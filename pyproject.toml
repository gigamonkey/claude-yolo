[project]
name = "claude-yolo"
version = "0.27.0"
description = "Run Claude Code in an ephemeral Docker container (yolo mode)."
requires-python = ">=3.10"
# keyring is the cross-platform credential store (macOS Keychain / Secret Service /
# Windows Credential Manager behind one API). Keep this in sync with the PEP 723
# `dependencies` block at the top of yolo.py — both list the script's runtime deps.
dependencies = ["keyring>=24"]

# `yolo.py` works two ways from the same file:
#   1. standalone — its PEP 723 header + shebang let `./yolo.py` self-run under uv;
#   2. installed — the console script below puts a `yolo` executable on PATH via
#      `uv tool install` / `pipx install` (deps above are pulled into its venv).
[project.scripts]
yolo = "yolo:main"

# The runtime is `yolo.py` plus its sibling data files (the built-in Dockerfiles,
# the container system prompt, and the container-docs/ reference docs mounted into
# each container); ship all of them in the wheel so _read_data_file and the docs
# mount find them next to yolo.py in site-packages.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "yolo.py",
    "Dockerfile.default",
    "Dockerfile.custom",
    "container-prompt.txt",
    "container-docs",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.3.0",
    "pytest>=8",
    "ruff>=0.6",
]

# Version bumping: `uv run bump-my-version bump patch` (or minor/major) updates
# the version here and in uv.lock, then commits and tags v{new_version}.
# Requires a clean working tree (allow_dirty defaults to false).
[tool.bumpversion]
current_version = "0.27.0"
commit = true
tag = true
tag_name = "v{new_version}"

# The [project] version. Anchored to line start so the current_version line
# above (which also ends in `version = "..."`) isn't matched too.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "^version = \"{current_version}\""
replace = "version = \"{new_version}\""
regex = true

# uv.lock records the project's own version; update it in the same commit so
# the lockfile doesn't go stale. The two-line search pins the match to this
# package's entry, not some same-versioned dependency.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"claude-yolo\"\nversion = \"{current_version}\""
replace = "name = \"claude-yolo\"\nversion = \"{new_version}\""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# Long lines are intentional here: the inline Dockerfile RUN commands, argparse
# help strings, and the docker-run echo are clearer unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
